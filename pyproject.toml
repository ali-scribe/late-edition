[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "late-edition"
version = "0.1.0"
description = "Restore historic newspaper OCR text with Gemma 4 and safety guards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "click==8.1.8",
    "google-genai==2.31.0",
    "jinja2==3.1.6",
    "pytest==9.1.1",
    "python-dotenv==1.2.4",
    "requests==2.32.3",
    "typer==0.15.1",
]

[project.scripts]
late-edition = "cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
